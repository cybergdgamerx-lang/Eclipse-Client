name: Build Eclipse Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'EclipseClient_NextGen_AutoBuild.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Check and extract ZIP
        run: |
          ls -la
          test -f EclipseClient_NextGen_AutoBuild.zip
          mkdir source
          unzip -q EclipseClient_NextGen_AutoBuild.zip -d source
          ls -la source

      - name: Build mod
        working-directory: source
        run: |
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EclipseClient-JAR
          path: source/build/libs/*.jar
          if-no-files-found: error
