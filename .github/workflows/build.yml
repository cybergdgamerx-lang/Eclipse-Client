
name: Build Eclipse Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'EclipseClient0.0.1_fixed.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          unzip -q EclipseClient0.0.1_fixed.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -100

      - name: Find Gradle project and build
        shell: bash
        run: |
          set -e
          BUILD_FILE=$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) | head -1)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --stacktrace

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
