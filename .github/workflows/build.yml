
name: Build Eclipse Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'EclipseClient0.0.1.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check ZIP exists
        run: |
          ls -la
          test -f EclipseClient0.0.1.zip

      - name: Extract project
        run: |
          mkdir source
          unzip -q EclipseClient0.0.1.zip -d source
          find source -maxdepth 3 -type f | head -60

      - name: Locate Gradle project
        run: |
          find source -name settings.gradle -o -name settings.gradle.kts
          find source -name build.gradle -o -name build.gradle.kts

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          cd source
          gradle build --stacktrace --warning-mode all 2>&1 | tee ../build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
